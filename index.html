<!doctype html>
<html lang="fi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Kahvisivusto</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">
</head>

<body>

  <!-- Navigaatio -->
  <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
    <div class="container">

      <a class="navbar-brand" href="#">Kahvisivusto</a>

      <!-- Hampurilaispainike -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Avaa navigaatio">

        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navigaation linkit -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a class="nav-link active" href="#">Etusivu</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#kahvit">Kahvit</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#tietoa">Tietoa</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#ukk">UKK</a>
          </li>

        </ul>
      </div>

    </div>
  </nav>

  <!-- Kuvakaruselli -->
<div id="kahviKaruselli" class="carousel slide" data-bs-ride="carousel">

  <!-- Kuvien alapuolella olevat pisteet -->
  <div class="carousel-indicators">
    <button type="button" data-bs-target="#kahviKaruselli" data-bs-slide-to="0"
      class="active" aria-current="true" aria-label="Kuva 1"></button>

    <button type="button" data-bs-target="#kahviKaruselli" data-bs-slide-to="1"
      aria-label="Kuva 2"></button>

    <button type="button" data-bs-target="#kahviKaruselli" data-bs-slide-to="2"
      aria-label="Kuva 3"></button>
  </div>

  <!-- Kuvat -->
  <div class="carousel-inner">

    <div class="carousel-item active">
      <img src="https://images.unsplash.com/photo-1510707577719-ae7c14805e3a"
        class="d-block w-100"
        style="height: 500px; object-fit: cover;"
        alt="Espresso kahvikupissa">

      <div class="carousel-caption d-none d-md-block">
        <h2>Espresso</h2>
        <p>Pieni mutta voimakas kahvijuoma.</p>
      </div>
    </div>

    <div class="carousel-item">
      <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085"
        class="d-block w-100"
        style="height: 500px; object-fit: cover;"
        alt="Kahvia ja kahvipapuja">

      <div class="carousel-caption d-none d-md-block">
        <h2>Kahvipavut</h2>
        <p>Hyvä kahvi alkaa laadukkaista pavuista.</p>
      </div>
    </div>

    <div class="carousel-item">
      <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93"
        class="d-block w-100"
        style="height: 500px; object-fit: cover;"
        alt="Kahvikuppi pöydällä">

      <div class="carousel-caption d-none d-md-block">
        <h2>Kahvihetki</h2>
        <p>Kahvista voi nauttia monella eri tavalla.</p>
      </div>
    </div>

  </div>

  <!-- Edellinen kuva -->
  <button class="carousel-control-prev" type="button"
    data-bs-target="#kahviKaruselli" data-bs-slide="prev">

    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Edellinen</span>
  </button>

  <!-- Seuraava kuva -->
  <button class="carousel-control-next" type="button"
    data-bs-target="#kahviKaruselli" data-bs-slide="next">

    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Seuraava</span>
  </button>

</div>

  <!-- Sivun pääsisältö -->
  <div class="container mt-5">
    <h1>Kahvisivusto</h1>
    <p>Tämä sivusto on tehty Bootstrapilla.</p>

    <button class="btn btn-primary">Testinappi</button>
  </div>

  <!-- Bootstrap JavaScript -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous">
  </script>

</body>

</html>
