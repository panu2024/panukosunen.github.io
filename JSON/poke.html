<!doctype html>
<html lang="fi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Pokemon-haku</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <!-- Oma CSS -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Navigaatio -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

      <a class="navbar-brand" href="index.html">JSON-tehtävä</a>

      <!-- Hampurilaispainike -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Avaa navigaatio">

        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navigaation linkit -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a class="nav-link" href="index.html">
              Etusivu
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="toteutus.html">
              Toteutus
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link active"
              href="poke.html"
              aria-current="page">
              Pokemon-haku
            </a>
          </li>

        </ul>
      </div>

    </div>
  </nav>


  <!-- Sivun pääsisältö -->
  <main class="container my-5">

    <h1>Pokemon-haku</h1>

    <p>
      Kirjoita Pokemonin nimi hakukenttään.
    </p>

    <!-- Pokemonin hakukenttä -->
    <div class="mb-3">

      <input
        type="text"
        id="pokemonName"
        class="form-control mb-2"
        placeholder="Enter Pokemon name">

      <button
        type="button"
        class="btn btn-primary"
        onclick="poke()">
        Hae
      </button>

    </div>


    <!-- Pokemonin nimi näytetään tässä -->
    <div id="nimi">
      Kirjoita laatikkoon Pokemonin nimi
    </div>

    <!-- Pokemonin kuva näytetään tässä -->
    <div id="kuva2"></div>

    <!-- Käännä-painike tulee tähän vasta haun jälkeen -->
    <div id="kaannaAlue" class="my-3"></div>

    <!-- Pokemonin lisätiedot tulevat tähän käännön jälkeen -->
    <div id="lisatiedot"></div>

  </main>


  <!-- Bootstrap JavaScript -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>


  <!-- Pokemon-haun JavaScript -->
  <script>

    // Tänne tallennetaan viimeksi haettu Pokemon
    let nykyinenPokemon = null;


    // Funktiota kutsutaan Hae-painikkeesta
    function poke() {

      // Tallennetaan käyttäjän antama nimi
      let name = document
        .getElementById("pokemonName")
        .value
        .trim();

      // Tarkistetaan, ettei hakukenttä ole tyhjä
      if (name === "") {

        document.getElementById("nimi").innerHTML =
          "<p>Kirjoita ensin Pokemonin nimi.</p>";

        return;
      }


      // Muutetaan nimi pieniksi kirjaimiksi API-hakua varten
      const pokeName = name.toLowerCase();


      // Haetaan Pokemonin tiedot PokeAPI:sta
      fetch(`https://pokeapi.co/api/v2/pokemon/${pokeName}`)

        // Tarkistetaan, onnistuiko haku
        .then(function(response) {

          if (!response.ok) {
            throw new Error("Pokemonia ei löytynyt");
          }

          return response.json();
        })

        // Välitetään JSON-vastaus pokekuva-funktiolle
        .then(function(responseJson) {
          pokekuva(responseJson, name);
        })

        // Jos haussa tapahtuu virhe
        .catch(function(error) {

          document.getElementById("nimi").innerHTML =
            "<p>Pokemonia ei löytynyt.</p>";

          document.getElementById("kuva2").innerHTML = "";
          document.getElementById("kaannaAlue").innerHTML = "";
          document.getElementById("lisatiedot").innerHTML = "";

        });

    }


    // Näytetään haetun Pokemonin nimi ja etupuolen kuva
    function pokekuva(obj, name) {

      // Tallennetaan haettu Pokemon myöhempää käyttöä varten
      nykyinenPokemon = obj;

      // Tallennetaan Pokemonin etupuolen kuvan osoite
      let pokeurl = obj.sprites.front_default;

      // Näytetään Pokemonin kuva
      document.getElementById("kuva2").innerHTML =
        '<img src="' +
        pokeurl +
        '" alt="' +
        name +
        '" class="img-fluid">';

      // Näytetään Pokemonin nimi
      document.getElementById("nimi").innerHTML =
        "<h2>" + name + "</h2>";

      // Lisätään Käännä-painike vasta onnistuneen haun jälkeen
      document.getElementById("kaannaAlue").innerHTML =
        '<button type="button" class="btn btn-secondary" onclick="kaanna()">Käännä</button>';

      // Tyhjennetään mahdollisen edellisen Pokemonin lisätiedot
      document.getElementById("lisatiedot").innerHTML = "";

      // Tyhjennetään hakukenttä
      document.getElementById("pokemonName").value = "";

    }


    // Käännetään Pokemon selkäpuolelle ja näytetään lisätiedot
    function kaanna() {

      // Tarkistetaan, että Pokemon on haettu
      if (nykyinenPokemon === null) {
        return;
      }


      // Haetaan Pokemonin selkäpuolen kuva
      let takaKuva = nykyinenPokemon.sprites.back_default;


      // Tarkistetaan, löytyykö selkäpuolen kuva
      if (takaKuva !== null) {

        document.getElementById("kuva2").innerHTML =
          '<img src="' +
          takaKuva +
          '" alt="Pokemon selkäpuolelta" class="img-fluid">';

      } else {

        document.getElementById("kuva2").innerHTML =
          "<p>Selkäpuolen kuvaa ei ole saatavilla.</p>";

      }


      // Selvitetään Pokemonin tyyppi tai tyypit
      let tyypit = "";

      for (let i = 0; i < nykyinenPokemon.types.length; i++) {

        tyypit += nykyinenPokemon.types[i].type.name;

        if (i < nykyinenPokemon.types.length - 1) {
          tyypit += ", ";
        }

      }


      // Näytetään kolme muuta Pokemonin ominaisuutta
      document.getElementById("lisatiedot").innerHTML = `
        <h3>Pokemonin ominaisuudet</h3>

        <p>
          <strong>Tyyppi:</strong>
          ${tyypit}
        </p>

        <p>
          <strong>Pituus:</strong>
          ${nykyinenPokemon.height}
        </p>

        <p>
          <strong>Paino:</strong>
          ${nykyinenPokemon.weight}
        </p>
      `;

    }

  </script>

</body>

</html>
