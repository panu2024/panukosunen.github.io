<!doctype html>
<html lang="fi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>JSON-tehtävä</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>

<body>

  <!-- Navigaatio -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

      <a class="navbar-brand" href="#">JSON-tehtävä</a>

      <!-- Hampurilaispainike -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Avaa navigaatio">

        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navigaation linkit -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a
              class="nav-link active"
              href="#"
              aria-current="page">
              Etusivu
            </a>
          </li>

        </ul>
      </div>

    </div>
  </nav>


  <!-- Sivun pääsisältö -->
  <main class="container my-5">

    <h1>JSON-datan käsittely</h1>

    <p>
      Tälle sivulle haetaan tietoa JSON-tiedostosta Fetch API:n avulla.
    </p>

    <!-- JSON-data näytetään tässä -->
    <div id="vastaus"></div>

  </main>


  <!-- Bootstrap JavaScript -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>


  <!-- JSON-datan haku Fetch API:n avulla -->
  <script>

    fetch("tietue.JSON")

      .then(function(response) {
        return response.json();
      })

      .then(function(data) {

        let sisaltoLista = "";

        data.sisalto.forEach(function(asia) {
          sisaltoLista += `<li>${asia}</li>`;
        });

        document.getElementById("vastaus").innerHTML = `
          <h2>${data.otsikko}</h2>

          <p>${data.kuvaus}</p>

          <img
            src="${data.kuva}"
            alt="Digitekniikat"
            class="img-fluid mb-4"
            style="max-width: 500px;">

          <h3>Opintojakso</h3>

          <p>
            <strong>Nimi:</strong>
            ${data.opintojakso.nimi}
          </p>

          <p>
            <strong>Tunnus:</strong>
            ${data.opintojakso.tunnus}
          </p>

          <p>
            <strong>Opintopisteet:</strong>
            ${data.opintojakso.opintopisteet}
          </p>

          <h3>Sisältö</h3>

          <ul>
            ${sisaltoLista}
          </ul>
        `;

      })

      .catch(function(error) {
        console.log("Virhe JSON-datan haussa:", error);
      });

  </script>

</body>

</html>
