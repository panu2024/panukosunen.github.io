<!doctype html>
<html lang="fi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>JSON-tehtävä</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <!-- Oma CSS -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Navigaatio -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

      <a class="navbar-brand" href="#">JSON-tehtävä</a>

      <!-- Hampurilaispainike -->
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Avaa navigaatio">

        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navigaation linkit -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a
              class="nav-link active"
              href="#"
              aria-current="page">
              Etusivu
            </a>
          </li>

        </ul>
      </div>

    </div>
  </nav>


  <!-- Sivun pääsisältö -->
  <main class="container my-5">

    <h1>JSON-datan käsittely</h1>

    <p>
      Tälle sivulle haetaan tietoa JSON-tiedostosta Fetch API:n avulla.
    </p>

    <!-- JSON-data näytetään tässä -->
    <div id="vastaus"></div>

  </main>


  <!-- Bootstrap JavaScript -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>


  <!-- JSON-datan haku ja käsittely -->
  <script>

    // Haetaan JSON-tiedosto
    fetch("tietue.JSON")

      // Muutetaan vastaus JavaScript-objektiksi
      .then(function(response) {
        return response.json();
      })

      // Välitetään JSON-data kerro-funktiolle
      .then(function(responseJson) {
        kerro(responseJson);
      })

      // Näytetään virheilmoitus, jos tiedon hakeminen epäonnistuu
      .catch(function(error) {
        document.getElementById("vastaus").innerHTML =
          "<p>Tietoa ei pystytä hakemaan.</p>";
      });


    // Näytetään JSON-tiedoston sisältö sivulla
    function kerro(obj) {

      // Otsikko, kuvaus ja kuva
      let tiedot = `
        <h2>${obj.otsikko}</h2>

        <p>${obj.kuvaus}</p>

        <img
          src="${obj.kuva}"
          alt="Digitekniikat"
          class="img-fluid mb-4"
          style="max-width: 500px;">
      `;


      // Opintojakson tiedot
      tiedot += `
        <h3>Opintojakso</h3>

        <p>
          <strong>Nimi:</strong>
          ${obj.opintojakso.nimi}
        </p>

        <p>
          <strong>Tunnus:</strong>
          ${obj.opintojakso.tunnus}
        </p>

        <p>
          <strong>Opintopisteet:</strong>
          ${obj.opintojakso.opintopisteet}
        </p>
      `;


      // Sisältö-osion otsikko
      tiedot += `
        <h3>Sisältö</h3>
        <ul>
      `;


      // Käydään sisältö-taulukko läpi
      obj.sisalto.forEach(function(asia) {
        tiedot += `<li>${asia}</li>`;
      });


      // Suljetaan sisältölista
      tiedot += `</ul>`;


      // Tekniikat-osion otsikko
      tiedot += `
        <h3>Tekniikat</h3>
        <ul>
      `;


      // Käydään tekniikat-taulukko läpi
      obj.tekniikat.forEach(function(tekniikka) {

        tiedot += `
          <li>
            <strong>${tekniikka.aihe}</strong>:
            <a
              href="${tekniikka.linkki}"
              target="_blank"
              rel="noopener noreferrer">
              ${tekniikka.linkki}
            </a>
          </li>
        `;

      });


      // Suljetaan tekniikkalista
      tiedot += `</ul>`;


      // Tulostetaan kaikki tiedot sivulle
      document.getElementById("vastaus").innerHTML = tiedot;
    }

  </script>

</body>

</html>
